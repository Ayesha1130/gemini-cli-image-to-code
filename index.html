<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========= HEADER ========= -->
    <header>
        <div class="logo">Canva</div>

        <nav>
            <a href="#">Design</a>
            <a href="#">Product</a>
            <a href="#">Plans</a>
            <a href="#">Business</a>
            <a href="#">Education</a>
            <a href="#">Help</a>
        </nav>

        <div class="auth">
            <button class="signup">Sign up</button>
            <button class="login">Log in</button>
        </div>
    </header>

    <!-- ========= HERO SECTION ========= -->
    <section class="hero">

        <h1>A new era <br> of imagination</h1>

        <p>
            Discover a whole new world of skills and tools designed to put your imagination to work.
        </p>

        <div class="buttons">
            <button class="primary">Start designing for free</button>
            <button class="secondary">Explore our launches</button>
        </div>

        <!-- ===== FLOATING SHAPES UNDER BUTTONS ===== -->
        <div class="hero-illustrations">
            <img src="assets/shape1.png" class="shape small" alt="">
            <img src="assets/shape2.png" class="shape medium" alt="">
            <img src="assets/shape3.png" class="shape large" alt="">
        </div>

    </section>

</body>
</html>
